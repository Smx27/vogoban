name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag (latest, beta, next)
        required: false
        default: beta
      dry_run:
        description: Run npm publish --dry-run
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Smoke test CLI
        run: |
          set -euo pipefail
          bun src/cli/main.ts --version
          bun src/cli/main.ts --help > /dev/null

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Smoke test packed tarball
        run: |
          set -euo pipefail
          TARBALL=$(npm pack --silent)
          TMPDIR=$(mktemp -d)
          cp "$TARBALL" "$TMPDIR/"
          cd "$TMPDIR"
          bun init -y >/dev/null
          bun add "./$TARBALL"
          ./node_modules/.bin/vogoban --version
          ./node_modules/.bin/vogoban --help > /dev/null

      - name: Resolve npm dist-tag
        id: dist-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-beta}"
          elif [ "$RELEASE_PRERELEASE" = "true" ]; then
            TAG="beta"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved npm dist-tag: $TAG"

      - name: Publish to npm (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public --tag ${{ steps.dist-tag.outputs.tag }}

      - name: Publish to npm
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }}
