apiVersion: apps/v1
kind: Deployment
metadata:
  name: vg-platform-gateway
  namespace: vg-enterprise
  labels:
    app.kubernetes.io/name: vg-platform-gateway
    app.kubernetes.io/part-of: vg-enterprise
    app.kubernetes.io/managed-by: infrastructure
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vg-platform-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vg-platform-gateway
        app.kubernetes.io/part-of: vg-enterprise
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: vg-enterprise-identity
      containers:
        - name: vg-platform-gateway
          image: vgentacr.azurecr.io/vg-platform-gateway:1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vg-enterprise-settings
            - secretRef:
                name: vg-enterprise-connections
          env:
            - name: AZURE_CLIENT_ID
              value: "00000000-0000-0000-0000-000000000000"
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
