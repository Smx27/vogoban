openapi: 3.0.1
info:
  title: Reporting.Worker
  version: '1.0'
paths:
  /api/reports/{id}:
    get:
      tags:
      - Reporting.Worker
      operationId: GetReportById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDto'
        '404':
          description: Not Found
  /api/Reports:
    get:
      tags:
      - Reports
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportDto'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportDto'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportDto'
  /api/Reports/requests:
    post:
      tags:
      - Reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ReportDto'
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDto'
            text/json:
              schema:
                $ref: '#/components/schemas/ReportDto'
components:
  schemas:
    CreateReportRequest:
      type: object
      properties:
        reportType:
          type: string
          nullable: true
        requestedBy:
          type: string
          nullable: true
      additionalProperties: false
    ReportDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reportType:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        artifactPath:
          type: string
          nullable: true
        requestedAt:
          type: string
          format: date-time
      additionalProperties: false
