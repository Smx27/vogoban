openapi: 3.0.1
info:
  title: Notification.Service
  version: '1.0'
paths:
  /api/Notifications/dispatches/{id}:
    get:
      tags:
      - Notifications
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/NotificationDispatchDto'
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDispatchDto'
            text/json:
              schema:
                $ref: '#/components/schemas/NotificationDispatchDto'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    NotificationDispatchDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          nullable: true
        channel:
          type: string
          nullable: true
        recipient:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: {}
